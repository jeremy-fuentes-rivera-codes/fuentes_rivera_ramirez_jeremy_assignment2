<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adventure Game</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js"></script>
</head>

<body>
    <main>
        <div id="game-container">
            <div id="welcome-screen">
                <h1>Welcome to Adventure Game Plan!</h1>
                <p>This is the tech career simulator. A game that mimics a possible career journey. If you want to get
                    started, click on the button below.</p>
                <button id="start-btn">Start Game</button>
            </div>


            <div id="question-container">
                <p id="question"><!--Question buttons will be injected here by JavaScript--></p>
            </div>

            <ul id="answers">
                <!-- Answer buttons will be injected here by JavaScript -->
            </ul>
            <button id="next-btn" onclick="nextQuestion()" class="hidden">Next</button>

            <img id="congrats-img" src="image/congratulations.png"
                alt="A dog wearing a cap that says congratulations" />
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Adventure Game Plan. All Rights Reserved.</p>
    </footer>
</body>

</html>
